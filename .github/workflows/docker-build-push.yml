name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Determine image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "mutable_tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "mutable_tag=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/minhntt1/network-statistics:${{ steps.tags.outputs.sha_short }}
            ghcr.io/minhntt1/network-statistics:${{ steps.tags.outputs.mutable_tag }}

      - name: Checkout local-infra
        uses: actions/checkout@v4
        with:
          repository: minhntt1/local-infra
          token: ${{ secrets.LOCAL_INFRA_PAT }}
          path: local-infra

      - name: Create PR with updated image tag
        env:
          GH_TOKEN: ${{ secrets.LOCAL_INFRA_PAT }}
        run: |
          cd local-infra
          BRANCH="chore/update-netstat-${{ steps.tags.outputs.env }}-${{ steps.tags.outputs.sha_short }}"
          FILE="helm/network-statistics/${{ steps.tags.outputs.env }}/values.yaml"

          git checkout -b "$BRANCH"
          sed -i "s/^  tag:.*/  tag: ${{ steps.tags.outputs.sha_short }}/" "$FILE"
          git config user.name "network-statistics CI"
          git config user.email "ci@network-statistics"
          git add "$FILE"
          git commit -m "chore: update network-statistics ${{ steps.tags.outputs.env }} image tag to ${{ steps.tags.outputs.sha_short }}"
          git push origin "$BRANCH"

          gh pr create \
            --repo minhntt1/local-infra \
            --base main \
            --head "$BRANCH" \
            --title "chore: update network-statistics ${{ steps.tags.outputs.env }} image tag to ${{ steps.tags.outputs.sha_short }}" \
            --body "Auto-generated by network-statistics CI ([${{ github.sha }}](https://github.com/minhntt1/network-statistics/commit/${{ github.sha }}))"